name: Scrape SEO guidance

on:
  schedule:
    - cron: "23 6 * * *" # daily, off the :00 rush
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Install html2text
        run: pip install --quiet html2text

      - name: Scrape sources
        run: bash scrape.sh

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "guidance-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A snapshots/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No guidance changes."
          else
            git commit -m "Guidance change detected: $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  triage:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # the scrape job just pushed the snapshot commit
          fetch-depth: 2

      - name: Triage diff with LLM (skips gracefully without API key)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # First-ever commit has no parent — nothing to diff yet.
          git diff HEAD~1 -- snapshots/ > /tmp/guidance.diff 2>/dev/null || : > /tmp/guidance.diff
          python3 triage.py /tmp/guidance.diff
